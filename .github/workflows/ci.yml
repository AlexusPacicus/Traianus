name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-hermetic:
    name: Hermetic tests (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e .
      - name: Hermetic suite (Phases 0–5)
        run: |
          HF_HUB_OFFLINE=1 pytest tests/ -m "not model" -q

  test-e2e-model:
    name: E2E with real model (@pytest.mark.model partition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e .
      - name: Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
          restore-keys: |
            ${{ runner.os }}-hf-all-MiniLM-L6-v2
      - name: Model prefetch (one time; offline if already cached)
        run: |
          python - <<'EOF'
          from sentence_transformers import SentenceTransformer
          try:
              # 1. Cache hit (restore-keys populated the HF cache): no network.
              SentenceTransformer("all-MiniLM-L6-v2", revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41", local_files_only=True)
          except Exception:
              # 2. Cache miss (clean runner): allow exactly one download to
              #    populate the job cache. HF_HUB_OFFLINE is NOT set here, so
              #    the hub stays in online mode and the download succeeds.
              #    Later steps enforce hermeticity with HF_HUB_OFFLINE=1.
              SentenceTransformer("all-MiniLM-L6-v2", revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41")
          EOF
      - name: E2E suite (Phase 6, @pytest.mark.model)
        run: |
          HF_HUB_OFFLINE=1 pytest tests/ -m "model" -q
      - name: Audit harness (C1 guard)
        run: |
          HF_HUB_OFFLINE=1 python tools/audit/audit_harness.py
      - name: WP0 semantics validation (Step 4)
        run: |
          HF_HUB_OFFLINE=1 python tools/experiments/validation/validate_c1_semantics.py

  static-and-coverage:
    name: Lint, types and coverage gate (ADR-025 A1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e .
          pip install ruff mypy coverage
      - name: Ruff (scoped to ADR-025 surface; legacy files excluded)
        run: |
          ruff check traianus/geometry/ traianus/storage/ traianus/telemetry/ \
            tests/unit/geometry/ tests/unit/storage/ tests/unit/telemetry/ \
            tests/integration/test_polar_ingesta_wiring.py \
            tests/integration/test_polar_projector_block.py \
            tests/integration/test_polar_telemetry_integration.py \
            tests/integration/test_sqlite_engine_block.py \
            tests/fixtures/polar_fixtures.py
      - name: Mypy (strict, whole control plane)
        run: |
          mypy traianus/
      - name: Coverage gate (>=85% over traianus/)
        # NOTE: coverage CLI (not pytest --cov) — the plugin crashes on
        # numpy re-import in some environments; `coverage run` is reliable.
        run: |
          HF_HUB_OFFLINE=1 coverage run -m pytest tests/ -q
          coverage report --include="traianus/*" --fail-under=85
